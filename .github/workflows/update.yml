name: Update procedures

# Rebuilds the published procedure files when the FAA's 28-day cycle changes.
#
# Runs every day, and on most days does almost nothing: it works out which
# cycle is in force, asks the published site which one it already has, and
# stops if they agree. Only on the day a new cycle takes effect does it fetch
# the CIFP, reduce it, and deploy.
#
# The same run works out where the charts that carry no georeferencing
# belong (build/place/), and publishes that beside the procedures.
#
# Only the built JSON is deployed. Nothing else in this repository is
# published by this workflow.

on:
  # A change to the build is tried at once. It deploys only if something
  # published is out of date or missing, like any other run.
  push:
    branches: [main]
    paths: ['build/**', 'package.json', 'package-lock.json', '.github/workflows/update.yml']
  schedule:
    # Cycles take effect at 0901Z. A little after, and off the hour, because
    # scheduled runs on the hour are the ones that get delayed.
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and deploy even if the published cycle is current
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      effective: ${{ steps.plan.outputs.effective }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Before anything is fetched: a parser that fails its own tests must not
      # be allowed to publish.
      - name: Test the parser and the placement rules
        run: node test/parse.test.js && node test/place.test.js

      - id: pages
        uses: actions/configure-pages@v5

      - id: plan
        name: Decide whether there is anything to do
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          FORCE: ${{ inputs.force }}
        run: |
          read -r EFFECTIVE URL < <(node build/cycle.js)
          echo "in force: $EFFECTIVE"
          echo "effective=$EFFECTIVE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          PUBLISHED=$(curl -fsS --max-time 30 "$BASE_URL/v1/index.json" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).effective||"")}catch(e){console.log("")}})' \
            || true)
          echo "published: ${PUBLISHED:-nothing}"
          # The chart placements are published beside the procedures and go
          # by the chart cycle's number; the two cycles turn over together.
          PLACED=$(curl -fsS --max-time 30 "$BASE_URL/v1/place/index.json" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).cycle||"")}catch(e){console.log("")}})' \
            || true)
          WANT=$(node -e 'const e=process.argv[1];const y=+e.slice(0,4);let n=0;for(let t=Date.parse(e+"T00:00:00Z");new Date(t).getUTCFullYear()===y;t-=28*86400000)n++;console.log(String(y%100).padStart(2,"0")+String(n).padStart(2,"0"))' "$EFFECTIVE")
          echo "chart cycle: $WANT, placements published: ${PLACED:-none}"
          echo "charts=$WANT" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ] || [ "$PUBLISHED" != "$EFFECTIVE" ] || [ "$PLACED" != "$WANT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Published cycle is current; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch the CIFP
        if: steps.plan.outputs.deploy == 'true'
        run: |
          mkdir -p work
          curl -fL --retry 4 --retry-delay 20 --max-time 300 \
            -A 'pfd-cifp build (GitHub Actions)' \
            -o work/cifp.zip '${{ steps.plan.outputs.url }}'
          unzip -o -q work/cifp.zip FAACIFP18 -d work
          ls -l work

      - name: Build
        if: steps.plan.outputs.deploy == 'true'
        run: |
          node build/build.js work/FAACIFP18 out | tee -a "$GITHUB_STEP_SUMMARY"
          # The file must be the cycle that was asked for. The FAA posts the
          # next cycle weeks early under the same naming, and a wrong date in
          # cycle.js would otherwise publish it as current.
          GOT=$(node -e 'console.log(require("./out/v1/index.json").effective)')
          if [ "$GOT" != '${{ steps.plan.outputs.effective }}' ]; then
            echo "built cycle is effective $GOT, expected ${{ steps.plan.outputs.effective }}" >&2
            exit 1
          fi

      # Where the charts with no georeferencing belong: the Department of
      # Defense's plates and the charted visual procedures, and only those.
      # About twelve hundred charts and an hour or two, nearly all of it OCR.
      # If it fails the procedures are still published; the placements are
      # then missing, and the next day's run sees that and tries again.
      - name: Place the charts that carry no georeferencing
        if: steps.plan.outputs.deploy == 'true'
        continue-on-error: true
        timeout-minutes: 300
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          npm ci
          curl -fL --retry 4 --retry-delay 20 --max-time 300 \
            -A 'pfd-cifp build (GitHub Actions)' \
            -o work/meta.xml 'https://aeronav.faa.gov/d-tpp/${{ steps.plan.outputs.charts }}/xml_data/d-TPP_Metafile.xml'
          node build/place/run.js --cifp work/FAACIFP18 --meta work/meta.xml --out out --pdf work/pdf --jobs 4 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # A record of what was published, committed once per cycle. It is also
      # what keeps this workflow alive: GitHub switches off scheduled runs in a
      # public repository that has seen no activity for 60 days, and without
      # this the only activity here would be the schedule itself.
      - uses: actions/checkout@v4
      - name: Record the cycle
        run: |
          printf '%s\n' '${{ needs.build.outputs.effective }}' > PUBLISHED
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLISHED
          git diff --cached --quiet || git commit -m "Published the cycle effective ${{ needs.build.outputs.effective }}"
          git push
